# RealtorFinder nginx configuration
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/realtorfinder
#          sudo ln -s /etc/nginx/sites-available/realtorfinder /etc/nginx/sites-enabled/
#          sudo certbot --nginx -d realtorfinder.net -d www.realtorfinder.net -d realtors.realtorfinder.net
#          sudo nginx -t && sudo systemctl reload nginx

# Redirect bare domain → www
server {
    listen 80;
    listen [::]:80;
    server_name realtorfinder.net;
    return 301 https://www.realtorfinder.net$request_uri;
}

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.realtorfinder.net realtors.realtorfinder.net;
    return 301 https://$host$request_uri;
}

# Main site — www.realtorfinder.net
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.realtorfinder.net;

    # SSL managed by certbot
    ssl_certificate     /etc/letsencrypt/live/www.realtorfinder.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.realtorfinder.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Large uploads (listing photos)
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE — keep connections alive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Realtors subdomain — realtors.realtorfinder.net
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name realtors.realtorfinder.net;

    # SSL managed by certbot (same cert if using a wildcard, or separate cert)
    ssl_certificate     /etc/letsencrypt/live/www.realtorfinder.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.realtorfinder.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
