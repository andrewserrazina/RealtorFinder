<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - RealtorFinder</title>
    <meta name="description" content="Reset your RealtorFinder account password.">
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BRGVVNKT65"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BRGVVNKT65');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A2540;
            --accent: #FF6B35;
            --soft-bg: #F8F6F3;
            --border: #E5E1DB;
            --success: #10B981;
            --error: #EF4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--soft-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 2.5rem;
            text-decoration: none;
        }
        .logo span { color: var(--accent); }
        .card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary);
        }
        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--accent); }
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 50px;
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Work Sans', sans-serif;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .btn:hover { background: var(--primary); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            display: none;
            padding: 0.875rem 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .message.success { background: rgba(16,185,129,0.1); color: #065f46; display: block; }
        .message.error { background: rgba(239,68,68,0.1); color: #991b1b; display: block; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }
        .back-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0A2540">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RealtorFinder">
</head>
<body>
    <a href="/" class="logo">Realtor<span>Finder</span></a>

    <!-- Forgot Password Form (shown when no token in URL) -->
    <div class="card" id="forgotCard">
        <h1>Forgot Password</h1>
        <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>
        <form id="forgotForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="forgotEmail" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn" id="forgotBtn">Send Reset Link</button>
        </form>
        <div id="forgotMessage" class="message"></div>
        <p class="back-link"><a href="/login">Back to login</a></p>
    </div>

    <!-- Reset Password Form (shown when ?token= in URL) -->
    <div class="card" id="resetCard" style="display:none;">
        <h1>Set New Password</h1>
        <p class="subtitle">Choose a strong password for your RealtorFinder account.</p>
        <form id="resetForm">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
            </div>
            <button type="submit" class="btn" id="resetBtn">Reset Password</button>
        </form>
        <div id="resetMessage" class="message"></div>
        <p class="back-link"><a href="/login">Back to login</a></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        // Show the right card based on URL
        if (token) {
            document.getElementById('forgotCard').style.display = 'none';
            document.getElementById('resetCard').style.display = 'block';
        }

        // Forgot password form
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('forgotBtn');
            const msgEl = document.getElementById('forgotMessage');
            msgEl.className = 'message';
            btn.disabled = true;
            btn.textContent = 'Sending…';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('forgotEmail').value.trim() })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                msgEl.textContent = 'Check your inbox — a reset link is on its way.';
                msgEl.className = 'message success';
                document.getElementById('forgotForm').reset();
            } catch (err) {
                msgEl.textContent = err.message || 'Something went wrong. Please try again.';
                msgEl.className = 'message error';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        });

        // Reset password form
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const msgEl = document.getElementById('resetMessage');
            msgEl.className = 'message';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                msgEl.textContent = 'Passwords do not match.';
                msgEl.className = 'message error';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting…';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                msgEl.textContent = '✓ Password reset! Redirecting to login…';
                msgEl.className = 'message success';
                setTimeout(() => window.location.href = '/login', 2000);
            } catch (err) {
                msgEl.textContent = err.message || 'This link is invalid or has expired. Please request a new one.';
                msgEl.className = 'message error';
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
</body>
</html>
