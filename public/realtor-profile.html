    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A2540;
            --accent: #FF6B35;
            --soft-bg: #F8F6F3;
            --text: #1A1A1A;
            --border: #E5E1DB;
            --muted: #6B7280;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--soft-bg); color: var(--text); }

        nav {
            background: var(--primary);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        .nav-logo { font-family: 'Crimson Pro', serif; font-size: 1.6rem; font-weight: 900; color: white; text-decoration: none; }
        .nav-logo span { color: var(--accent); }
        .nav-back { color: rgba(255,255,255,0.7); font-size: 0.9rem; text-decoration: none; display: flex; align-items: center; gap: 0.4rem; }
        .nav-back:hover { color: white; }

        .profile-wrap {
            max-width: 780px;
            margin: 3rem auto;
            padding: 0 1.5rem 4rem;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #1a4a7a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            font-weight: 900;
            color: white;
            flex-shrink: 0;
        }

        .profile-name-block h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1.15;
        }

        .company-name {
            font-size: 1rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-featured { background: #FFF0EB; color: var(--accent); }
        .badge-verified { background: #ECFDF5; color: #059669; }
        .badge-area { background: var(--soft-bg); color: var(--primary); }

        .stats-row {
            display: flex;
            gap: 2rem;
            padding: 1.5rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .stat { text-align: center; }
        .stat-value { font-family: 'Crimson Pro', serif; font-size: 1.8rem; font-weight: 900; color: var(--primary); line-height: 1; }
        .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

        .section-title {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        .bio-text {
            font-size: 1rem;
            line-height: 1.75;
            color: #444;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .detail-item { padding: 1rem; background: var(--soft-bg); border-radius: 10px; }
        .detail-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
        .detail-value { font-weight: 600; color: var(--primary); font-size: 0.95rem; }

        .not-found {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--muted);
        }
        .not-found h2 { font-family: 'Crimson Pro', serif; font-size: 2rem; color: var(--primary); margin-bottom: 1rem; }

        .skeleton {
            background: linear-gradient(90deg, #f0ede9 25%, #e8e4df 50%, #f0ede9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        @media (max-width: 600px) {
            .profile-header { flex-direction: column; }
            .details-grid { grid-template-columns: 1fr; }
            .stats-row { gap: 1.25rem; }
        }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0A2540">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RealtorFinder">
</head>
<body>

<nav>
    <a href="/" class="nav-logo">Realtor<span>Finder</span></a>
    <a href="javascript:history.back()" class="nav-back">← Back</a>
</nav>

<div class="profile-wrap">
    <div id="profileContent">
        <!-- Loading skeleton -->
        <div class="profile-card">
            <div class="profile-header">
                <div class="skeleton" style="width:80px;height:80px;border-radius:50%;"></div>
                <div style="flex:1;">
                    <div class="skeleton" style="height:28px;width:55%;margin-bottom:10px;"></div>
                    <div class="skeleton" style="height:18px;width:35%;margin-bottom:12px;"></div>
                    <div class="skeleton" style="height:24px;width:45%;"></div>
                </div>
            </div>
            <div class="skeleton" style="height:16px;width:100%;margin-bottom:8px;"></div>
            <div class="skeleton" style="height:16px;width:80%;"></div>
        </div>
    </div>
</div>

<script>
    const realtorId = parseInt(window.location.pathname.split('/').pop());
    let isRealtorSaved = false;
    let currentUserId = null;

    async function initSaveState() {
        try {
            const res = await fetch('/api/auth/me', { credentials: 'include' });
            if (!res.ok) return;
            const user = await res.json();
            currentUserId = user.id;
            const savedRes = await fetch('/api/saved-realtors', { credentials: 'include' });
            if (savedRes.ok) {
                const saved = await savedRes.json();
                isRealtorSaved = saved.some(r => r.id === realtorId);
            }
        } catch {}
    }

    async function toggleSaveProfile() {
        if (!currentUserId) { window.location.href = '/login'; return; }
        const btn = document.getElementById('saveRealtorBtn');
        try {
            const res = await fetch(`/api/saved-realtors/${realtorId}`, {
                method: isRealtorSaved ? 'DELETE' : 'POST',
                credentials: 'include'
            });
            if (!res.ok) throw new Error('Failed');
            isRealtorSaved = !isRealtorSaved;
            btn.textContent = isRealtorSaved ? '♥ Saved' : '♡ Save Realtor';
            btn.style.color = isRealtorSaved ? '#ef4444' : '';
            btn.style.borderColor = isRealtorSaved ? '#ef4444' : '';
        } catch { alert('Could not update. Please try again.'); }
    }

    async function loadProfile() {
        await initSaveState();
        try {
            const [profileRes, rtRes, badgesRes] = await Promise.all([
                fetch(`/api/realtors/${realtorId}/public`),
                fetch(`/api/realtors/${realtorId}/response-time`),
                fetch(`/api/realtors/${realtorId}/badges`)
            ]);
            if (!profileRes.ok) { showNotFound(); return; }
            const r = await profileRes.json();
            const rt = rtRes.ok ? await rtRes.json() : { label: null };
            const bd = badgesRes.ok ? await badgesRes.json() : {};
            renderProfile(r, rt, bd);
            document.title = `${r.first_name} ${r.last_name} — RealtorFinder`;
        } catch {
            showNotFound();
        }
    }

    function renderProfile(r, rt, bd = {}) {
        const initials = ((r.first_name || '')[0] || '') + ((r.last_name || '')[0] || '');
        const isFeatured = ['professional', 'firm'].includes(r.subscription_plan || r.company_plan);
        const hasLicense = r.license_number && r.license_number.trim();
        const hasYears = r.years_experience && parseInt(r.years_experience) > 0;
        const hasBio = r.bio && r.bio.trim();
        const serviceAreas = r.service_areas
            ? (Array.isArray(r.service_areas) ? r.service_areas : r.service_areas.split(',').map(s => s.trim())).filter(Boolean)
            : [];

        const statsHtml = [
            hasYears ? `<div class="stat"><div class="stat-value">${r.years_experience}</div><div class="stat-label">Years Experience</div></div>` : '',
            hasLicense ? `<div class="stat"><div class="stat-value" style="font-size:1rem;padding-top:0.3rem;">${r.license_number}</div><div class="stat-label">License #</div></div>` : '',
            bd.winRate != null ? `<div class="stat"><div class="stat-value">${bd.winRate}%</div><div class="stat-label">Win Rate</div></div>` : '',
            bd.totalProposals > 0 ? `<div class="stat"><div class="stat-value">${bd.totalProposals}</div><div class="stat-label">Proposals Sent</div></div>` : '',
            bd.reviewCount > 0 ? `<div class="stat"><div class="stat-value">${bd.avgRating ? parseFloat(bd.avgRating).toFixed(1) : '—'}</div><div class="stat-label">Avg Rating</div></div>` : '',
        ].filter(Boolean).join('');

        const detailsHtml = [
            r.company_name ? `<div class="detail-item"><div class="detail-label">Company / Brokerage</div><div class="detail-value">${esc(r.company_name)}</div></div>` : '',
            r.zip_code     ? `<div class="detail-item"><div class="detail-label">Primary Market</div><div class="detail-value">${esc(r.zip_code)}</div></div>` : '',
        ].filter(Boolean).join('');

        document.getElementById('profileContent').innerHTML = `
            <div class="profile-card">
                <div class="profile-header">
                    <div class="avatar">${r.profile_photo ? `<img src="${esc(r.profile_photo)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : esc(initials.toUpperCase())}</div>
                    <div class="profile-name-block">
                        <h1>${esc(r.first_name)} ${esc(r.last_name)}</h1>
                        ${r.company_name ? `<div class="company-name">${esc(r.company_name)}</div>` : ''}
                        <div class="badges">
                            ${isFeatured ? '<span class="badge badge-featured">⭐ Featured Agent</span>' : ''}
                            ${r.license_verified ? '<span class="badge badge-verified" style="background:#ECFDF5;color:#059669;">✓ Verified License</span>' : (hasLicense ? '<span class="badge badge-verified">✓ Licensed</span>' : '')}
                            ${(bd.badges || []).map(b => `<span class="badge" style="background:#FFF7ED;color:#C2410C;">${b}</span>`).join('')}
                            ${serviceAreas.map(a => `<span class="badge badge-area">${esc(a)}</span>`).join('')}
                        </div>
                        <div id="profileRatingBadge" style="margin-top:0.5rem;display:flex;align-items:center;gap:0.5rem;"></div>
                        <button id="saveRealtorBtn" onclick="toggleSaveProfile()" style="margin-top:0.75rem;background:none;border:1px solid #e5e7eb;border-radius:20px;padding:6px 16px;cursor:pointer;font-size:0.9rem;font-weight:600;color:${isRealtorSaved ? '#ef4444' : '#666'};border-color:${isRealtorSaved ? '#ef4444' : '#e5e7eb'};">${isRealtorSaved ? '♥ Saved' : '♡ Save Realtor'}</button>
                    </div>
                </div>

                ${statsHtml ? `<div class="stats-row">${statsHtml}</div>` : ''}

                ${hasBio ? `
                    <div class="section-title">About</div>
                    <p class="bio-text">${esc(r.bio)}</p>
                ` : ''}
                ${rt && rt.label ? `<div style="display:inline-block;background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;border-radius:20px;padding:4px 12px;font-size:0.85rem;font-weight:600;margin-top:0.5rem;">⚡ ${esc(rt.label)}</div>` : ''}
            </div>

            ${detailsHtml ? `
                <div class="profile-card">
                    <div class="section-title">Details</div>
                    <div class="details-grid">${detailsHtml}</div>
                </div>
            ` : ''}
            <div class="profile-card" id="reviewsCard">
                <div class="section-title">Reviews</div>
                <div id="reviewsList"><p style="color:var(--muted);font-size:0.9rem;">Loading reviews…</p></div>
            </div>
            <div class="profile-card" id="contactCard">
                <div class="section-title">Send a Message</div>
                <p style="color:var(--muted);font-size:0.9rem;margin-bottom:1rem;">Interested in working with this agent? Send them a message directly.</p>
                <textarea id="contactMsg" rows="4" placeholder="Hi, I'm interested in selling my home at..."
                          style="width:100%;padding:0.75rem;border:1px solid #e5e7eb;border-radius:8px;font-size:0.9rem;resize:vertical;margin-bottom:0.75rem;font-family:inherit;"></textarea>
                <button onclick="sendContactMessage()"
                        style="background:#FF6B35;color:white;border:none;padding:0.75rem 1.5rem;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.95rem;width:100%;">
                    Send Message
                </button>
                <p id="contactStatus" style="margin-top:0.5rem;font-size:0.85rem;text-align:center;"></p>
            </div>
        `;
        loadReviews();
    }

    async function loadReviews() {
        try {
            const res = await fetch(`/api/realtors/${realtorId}/reviews`);
            if (!res.ok) return;
            const { reviews, avg, count } = await res.json();

            // Update header rating badge
            if (avg && count) {
                const starsFull = Math.floor(avg);
                const hasHalf = avg % 1 >= 0.5;
                const stars = '★'.repeat(starsFull) + (hasHalf ? '½' : '') + '☆'.repeat(5 - Math.ceil(avg));
                const ratingEl = document.getElementById('profileRatingBadge');
                if (ratingEl) ratingEl.innerHTML = `<span style="color:#F59E0B;font-size:1.1rem;">${stars}</span> <strong>${parseFloat(avg).toFixed(1)}</strong> <span style="color:#888;font-size:0.85rem;">(${count} review${count!==1?'s':''})</span>`;
            }

            const container = document.getElementById('reviewsList');
            const stars = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
            const reviewsHtml = count ? `
                <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;">
                    <span style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:900;color:var(--primary);">${avg}</span>
                    <span style="color:#f59e0b;font-size:1.2rem;">${stars(parseFloat(avg))}</span>
                    <span style="color:var(--muted);font-size:0.85rem;">${count} review${count !== 1 ? 's' : ''}</span>
                </div>
                ${reviews.map(r => `
                    <div style="padding:1rem 0;border-top:1px solid var(--border);">
                        <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.4rem;flex-wrap:wrap;">
                            <span style="color:#f59e0b;">${stars(r.rating)}</span>
                            <span style="font-weight:600;font-size:0.9rem;">${esc(r.reviewer_name || ((r.first_name || '') + (r.last_name ? ' ' + r.last_name[0] + '.' : '')) || 'Anonymous')}</span>
                            <span style="color:var(--muted);font-size:0.8rem;">${new Date(r.created_at).toLocaleDateString('en-US',{month:'short',year:'numeric'})}</span>
                            ${r.verified_sale ? '<span style="background:#d1fae5;color:#065f46;font-size:0.72rem;padding:2px 8px;border-radius:20px;font-weight:700;">✓ Verified Sale</span>' : ''}
                        </div>
                        ${r.body || r.comment ? `<p style="font-size:0.9rem;color:#444;line-height:1.6;">${esc(r.body || r.comment)}</p>` : ''}
                        ${r.listing_address ? `<p style="font-size:0.78rem;color:var(--muted);margin-top:0.3rem;">📍 ${esc(r.listing_address)}</p>` : ''}
                    </div>
                `).join('')}
            ` : '<p style="color:var(--muted);font-size:0.9rem;">No reviews yet.</p>';
            container.innerHTML = reviewsHtml + `
                <div id="reviewFormSection" style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);">
                    <h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem;">Leave a Review</h3>
                    <div style="display:flex;gap:0.5rem;margin-bottom:1rem;" id="starRating">
                        ${[1,2,3,4,5].map(n => `<span data-star="${n}" onclick="selectStar(${n})" style="font-size:2rem;cursor:pointer;color:#d1d5db;transition:color 0.15s;">★</span>`).join('')}
                    </div>
                    <textarea id="reviewComment" rows="3" placeholder="Share your experience working with this realtor..." style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;resize:vertical;margin-bottom:0.75rem;"></textarea>
                    <div id="reviewError" style="display:none;color:#ef4444;font-size:0.85rem;margin-bottom:0.75rem;"></div>
                    <button onclick="submitReview()" style="background:var(--accent);color:white;border:none;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;">Submit Review</button>
                </div>`;
        } catch {}
    }

    let selectedRating = 0;
    function selectStar(n) {
        selectedRating = n;
        document.querySelectorAll('#starRating [data-star]').forEach(el => {
            el.style.color = parseInt(el.dataset.star) <= n ? '#f59e0b' : '#d1d5db';
        });
    }

    async function submitReview() {
        const errEl = document.getElementById('reviewError');
        errEl.style.display = 'none';
        if (!selectedRating) { errEl.textContent = 'Please select a star rating.'; errEl.style.display = 'block'; return; }
        const comment = document.getElementById('reviewComment').value;
        const listingId = new URLSearchParams(window.location.search).get('listing_id') || null;
        try {
            const res = await fetch('/api/reviews', {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ realtor_id: parseInt(realtorId), listing_id: listingId ? parseInt(listingId) : null, rating: selectedRating, comment })
            });
            const d = await res.json();
            if (!res.ok) { errEl.textContent = d.error || 'Failed to submit review.'; errEl.style.display = 'block'; return; }
            document.getElementById('reviewFormSection').innerHTML = '<p style="color:#065f46;font-weight:600;">Thank you for your review!</p>';
            loadReviews();
        } catch { errEl.textContent = 'Network error. Please try again.'; errEl.style.display = 'block'; }
    }

    async function sendContactMessage() {
        const msg = document.getElementById('contactMsg').value.trim();
        const statusEl = document.getElementById('contactStatus');
        if (!msg) { statusEl.textContent = 'Please enter a message.'; statusEl.style.color = '#ef4444'; return; }
        try {
            const authRes = await fetch('/api/auth/me', { credentials: 'include' });
            if (!authRes.ok) {
                statusEl.innerHTML = '<a href="/login" style="color:#FF6B35;">Log in</a> to send a message.';
                statusEl.style.color = '#666';
                return;
            }
            const res = await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ to_user_id: realtorId, body: msg }),
            });
            const data = await res.json();
            if (!res.ok) {
                statusEl.textContent = data.error || 'Failed to send message.';
                statusEl.style.color = '#ef4444';
                return;
            }
            document.getElementById('contactMsg').value = '';
            statusEl.textContent = 'Message sent!';
            statusEl.style.color = '#10B981';
        } catch {
            statusEl.textContent = 'Failed to send message. Try again.';
            statusEl.style.color = '#ef4444';
        }
    }

    // Auto-scroll to review form if ?review=1
    function checkAutoReview() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('review') === '1') {
            const card = document.getElementById('reviewsCard');
            if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        }
    }

    function showNotFound() {
        document.getElementById('profileContent').innerHTML = `
            <div class="not-found">
                <h2>Profile Not Found</h2>
                <p>This realtor profile doesn't exist or is no longer active.</p>
            </div>
        `;
    }

    function esc(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadProfile().then(() => setTimeout(checkAutoReview, 600));
</script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
</body>
</html>
