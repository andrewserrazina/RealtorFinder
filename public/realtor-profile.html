    <style>
        :root {
            --primary: #0A2540;
            --accent: #FF6B35;
            --soft-bg: #F8F6F3;
            --text: #1A1A1A;
            --border: #E5E1DB;
            --muted: #6B7280;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--soft-bg); color: var(--text); }

        nav {
            background: var(--primary);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        .nav-logo { font-family: 'Crimson Pro', serif; font-size: 1.6rem; font-weight: 900; color: white; text-decoration: none; }
        .nav-logo span { color: var(--accent); }
        .nav-back { color: rgba(255,255,255,0.7); font-size: 0.9rem; text-decoration: none; display: flex; align-items: center; gap: 0.4rem; }
        .nav-back:hover { color: white; }

        .profile-wrap {
            max-width: 780px;
            margin: 3rem auto;
            padding: 0 1.5rem 4rem;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #1a4a7a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            font-weight: 900;
            color: white;
            flex-shrink: 0;
        }

        .profile-name-block h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1.15;
        }

        .company-name {
            font-size: 1rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-featured { background: #FFF0EB; color: var(--accent); }
        .badge-verified { background: #ECFDF5; color: #059669; }
        .badge-area { background: var(--soft-bg); color: var(--primary); }

        .stats-row {
            display: flex;
            gap: 2rem;
            padding: 1.5rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .stat { text-align: center; }
        .stat-value { font-family: 'Crimson Pro', serif; font-size: 1.8rem; font-weight: 900; color: var(--primary); line-height: 1; }
        .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

        .section-title {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        .bio-text {
            font-size: 1rem;
            line-height: 1.75;
            color: #444;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .detail-item { padding: 1rem; background: var(--soft-bg); border-radius: 10px; }
        .detail-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
        .detail-value { font-weight: 600; color: var(--primary); font-size: 0.95rem; }

        .not-found {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--muted);
        }
        .not-found h2 { font-family: 'Crimson Pro', serif; font-size: 2rem; color: var(--primary); margin-bottom: 1rem; }

        .skeleton {
            background: linear-gradient(90deg, #f0ede9 25%, #e8e4df 50%, #f0ede9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Enhanced stats bar */
        .stats-row { justify-content: flex-start; }
        .stat-stars { color: #F59E0B; font-size: 1.1rem; line-height: 1; }

        /* Earned badges chips */
        .earned-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .earned-badge {
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.35rem 0.85rem; border-radius: 20px;
            font-size: 0.82rem; font-weight: 600;
        }

        /* Reviews */
        .review-item { padding: 1rem 0; border-top: 1px solid var(--border); }
        .review-meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
        .review-stars { color: #F59E0B; }
        .review-name { font-weight: 600; font-size: 0.9rem; }
        .review-date { color: var(--muted); font-size: 0.8rem; }
        .chip-verified-sale { background: #d1fae5; color: #065f46; font-size: 0.72rem; padding: 2px 8px; border-radius: 20px; font-weight: 700; }

        /* Availability grid */
        .avail-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; }
        .avail-day { background: var(--soft-bg); border-radius: 8px; padding: 0.6rem 0.4rem; text-align: center; }
        .avail-day-name { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 0.35rem; }
        .avail-slot { font-size: 0.72rem; color: var(--primary); background: #e8f4ff; border-radius: 4px; padding: 2px 4px; margin-top: 0.25rem; line-height: 1.4; }
        .avail-none { font-size: 0.72rem; color: #ccc; margin-top: 0.25rem; }
        .avail-day.has-slots { background: #f0f9ff; border: 1px solid #bae6fd; }
        .avail-day.has-slots .avail-day-name { color: #0369a1; }

        /* CTA section */
        .cta-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .cta-btn-primary { background: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
        .cta-btn-secondary { background: white; color: var(--primary); border: 1.5px solid var(--primary); padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
        .cta-btn-primary:hover { opacity: 0.9; }
        .cta-btn-secondary:hover { background: var(--soft-bg); }

        @media (max-width: 600px) {
            .profile-header { flex-direction: column; }
            .details-grid { grid-template-columns: 1fr; }
            .stats-row { gap: 1.25rem; }
            .avail-grid { grid-template-columns: repeat(4, 1fr); }
            .cta-row { flex-direction: column; }
        }
    </style>

<div class="profile-wrap">
    <div id="profileContent">
        <!-- Loading skeleton -->
        <div class="profile-card">
            <div class="profile-header">
                <div class="skeleton" style="width:80px;height:80px;border-radius:50%;"></div>

                    <div class="skeleton" style="height:28px;width:55%;margin-bottom:10px;"></div>

<script>
    const _urlParams = new URLSearchParams(window.location.search);
    const realtorId = parseInt(_urlParams.get('id')) || parseInt(window.location.pathname.split('/').pop());
    let isRealtorSaved = false;
    let currentUserId = null;

    async function initSaveState() {
        try {
            const res = await fetch('/api/auth/me', { credentials: 'include' });
            if (!res.ok) return;
            const user = await res.json();
            currentUserId = user.id;
            const savedRes = await fetch('/api/saved-realtors', { credentials: 'include' });
            if (savedRes.ok) {
                const saved = await savedRes.json();
                isRealtorSaved = saved.some(r => r.id === realtorId);
            }
        } catch {}
    }

    async function toggleSaveProfile() {
        if (!currentUserId) { window.location.href = '/login'; return; }
        const btn = document.getElementById('saveRealtorBtn');
        try {
            const res = await fetch(`/api/saved-realtors/${realtorId}`, {
                method: isRealtorSaved ? 'DELETE' : 'POST',
                credentials: 'include'
            });
            if (!res.ok) throw new Error('Failed');
            isRealtorSaved = !isRealtorSaved;
            btn.textContent = isRealtorSaved ? '♥ Saved' : '♡ Save Realtor';
            btn.style.color = isRealtorSaved ? '#ef4444' : '';
            btn.style.borderColor = isRealtorSaved ? '#ef4444' : '';
        } catch { alert('Could not update. Please try again.'); }
    }

    async function loadProfile() {
        await initSaveState();
        try {
            const [profileRes, rtRes, badgesRes, reviewsRes, availRes] = await Promise.all([
                fetch(`/api/realtors/${realtorId}/public`),
                fetch(`/api/realtors/${realtorId}/response-time`),
                fetch(`/api/realtors/${realtorId}/badges`),
                fetch(`/api/realtors/${realtorId}/reviews`),
                fetch(`/api/realtors/${realtorId}/availability`)
            ]);
            if (!profileRes.ok) { showNotFound(); return; }
            const r = await profileRes.json();
            const rt = rtRes.ok ? await rtRes.json() : { label: null };
            const bd = badgesRes.ok ? await badgesRes.json() : {};

            // Normalize reviews response: API may return a plain array or {reviews, avg, count}
            let rv = {};
            if (reviewsRes.ok) {
                const raw = await reviewsRes.json();
                if (Array.isArray(raw)) {
                    const reviews = raw.slice(0, 5);
                    const count = raw.length;
                    const avg = count
                        ? (raw.reduce((s, x) => s + (parseFloat(x.rating) || 0), 0) / count).toFixed(1)
                        : null;
                    rv = { reviews, avg: avg ? parseFloat(avg) : null, count };
                } else {
                    // Already shaped as {reviews, avg, count} or similar
                    rv = {
                        reviews: (raw.reviews || []).slice(0, 5),
                        avg: raw.avg != null ? parseFloat(raw.avg) : (raw.avg_rating != null ? parseFloat(raw.avg_rating) : null),
                        count: raw.count != null ? raw.count : (raw.review_count != null ? raw.review_count : (raw.reviews || []).length)
                    };
                }
            }

            // Normalize badges response: ensure bd.badges is an array
            const bdNorm = {
                badges: Array.isArray(bd.badges) ? bd.badges : (Array.isArray(bd) ? bd : []),
                winRate: bd.winRate != null ? bd.winRate : null,
                totalProposals: bd.totalProposals != null ? bd.totalProposals : null,
                avgRating: bd.avgRating != null ? bd.avgRating : (bd.avg_rating != null ? bd.avg_rating : null),
                reviewCount: bd.reviewCount != null ? bd.reviewCount : (bd.review_count != null ? bd.review_count : null),
            };

            // Normalize availability: must be an array
            const av = availRes.ok ? await availRes.json() : [];
            const avArr = Array.isArray(av) ? av : [];

            renderProfile(r, rt, bdNorm, rv, avArr);
            document.title = `${r.first_name} ${r.last_name} — RealtorFinder`;
        } catch (err) {
            console.error('loadProfile error:', err);
            showNotFound();
        }
    }

    function renderStars(n, total = 5) {
        const filled = Math.round(n);
        return '★'.repeat(filled) + '☆'.repeat(total - filled);
    }

    function relativeDate(dateStr) {
        const d = new Date(dateStr);
        const now = new Date();
        const diffMs = now - d;
        const diffDays = Math.floor(diffMs / 86400000);
        if (diffDays < 1)  return 'Today';
        if (diffDays < 7)  return `${diffDays}d ago`;
        if (diffDays < 30) return `${Math.floor(diffDays / 7)}w ago`;
        if (diffDays < 365) return `${Math.floor(diffDays / 30)}mo ago`;
        return `${Math.floor(diffDays / 365)}y ago`;
    }

    function renderBadgeChip(b) {
        // b may be an object {label, icon, color, bg} or a plain string
        if (typeof b === 'object' && b !== null) {
            const bg  = b.bg    || b.background || '#FFF7ED';
            const clr = b.color || '#C2410C';
            const icon = b.icon ? `${esc(b.icon)} ` : '';
            const label = esc(b.label || b.name || '');
            return `<span class="earned-badge" style="background:${esc(bg)};color:${esc(clr)};">${icon}${label}</span>`;
        }
        return `<span class="earned-badge" style="background:#FFF7ED;color:#C2410C;">${esc(String(b))}</span>`;
    }

    function renderAvailability(avail) {
        const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        // Group slots by day_of_week
        const byDay = {};
        (avail || []).forEach(slot => {
            const d = slot.day_of_week;
            if (!byDay[d]) byDay[d] = [];
            byDay[d].push(slot);
        });

        function fmtTime(t) {
            if (!t) return '';
            const [hh, mm] = t.split(':').map(Number);
            const ampm = hh >= 12 ? 'PM' : 'AM';
            const h = ((hh % 12) || 12);
            return mm ? `${h}:${String(mm).padStart(2,'0')}${ampm}` : `${h}${ampm}`;
        }

        const cells = DAY_NAMES.map((name, idx) => {
            const slots = byDay[idx] || [];
            const hasSlots = slots.length > 0;
            const slotsHtml = hasSlots
                ? slots.map(s => `<div class="avail-slot">${fmtTime(s.start_time)}–${fmtTime(s.end_time)}</div>`).join('')
                : `<div class="avail-none">—</div>`;
            return `<div class="avail-day${hasSlots ? ' has-slots' : ''}">
                <div class="avail-day-name">${name}</div>
                ${slotsHtml}
            </div>`;
        }).join('');

        return cells;
    }

    function renderReviewsHtml(rv) {
        const reviews = (rv.reviews || []).slice(0, 5);
        const avg = rv.avg;
        const count = rv.count || 0;

        if (!count) return '<p style="color:var(--muted);font-size:0.9rem;">No reviews yet.</p>';

        const avgNum = parseFloat(avg) || 0;
        const summaryHtml = `
            <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;">
                <span style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:900;color:var(--primary);">${avgNum.toFixed(1)}</span>
                <span class="review-stars" style="font-size:1.2rem;">${renderStars(avgNum)}</span>
                <span style="color:var(--muted);font-size:0.85rem;">${count} review${count !== 1 ? 's' : ''}</span>
            </div>`;

        const reviewItems = reviews.map(r => {
            const name = esc(r.reviewer_name || ((r.first_name || '') + (r.last_name ? ' ' + r.last_name[0] + '.' : '')) || 'Anonymous');
            const body = r.body || r.comment;
            return `<div class="review-item">
                <div class="review-meta">
                    <span class="review-stars">${renderStars(r.rating)}</span>
                    <span class="review-name">${name}</span>
                    <span class="review-date">${relativeDate(r.created_at)}</span>
                    ${r.verified_sale ? '<span class="chip-verified-sale">✓ Verified Sale</span>' : ''}
                </div>
                ${body ? `<p style="font-size:0.9rem;color:#444;line-height:1.6;">${esc(body)}</p>` : ''}
                ${r.listing_address ? `<p style="font-size:0.78rem;color:var(--muted);margin-top:0.3rem;">📍 ${esc(r.listing_address)}</p>` : ''}
            </div>`;
        }).join('');

        return summaryHtml + reviewItems;
    }

    function renderProfile(r, rt, bd = {}, rv = {}, av = []) {
        const initials = ((r.first_name || '')[0] || '') + ((r.last_name || '')[0] || '');
        const isFeatured = ['professional', 'firm'].includes(r.subscription_plan || r.company_plan);
        const hasLicense = r.license_number && r.license_number.trim();
        const hasYears = r.years_experience && parseInt(r.years_experience) > 0;
        const hasBio = r.bio && r.bio.trim();
        const serviceAreas = r.service_areas
            ? (Array.isArray(r.service_areas) ? r.service_areas : r.service_areas.split(',').map(s => s.trim())).filter(Boolean)
            : [];

        // Prefer reviews endpoint data for rating/count, fall back to profile then badges
        const avgRating  = (rv.avg != null ? rv.avg : null)
                        || parseFloat(r.avg_rating || 0) || null
                        || (bd.avgRating != null ? parseFloat(bd.avgRating) : null);
        const reviewCount = (rv.count != null ? rv.count : 0)
                         || parseInt(r.review_count || 0) || 0
                         || parseInt(bd.reviewCount || 0) || 0;
        const acceptedProposals = parseInt(r.accepted_proposals || 0) || 0;
        const totalProposals    = parseInt(r.total_proposals    || bd.totalProposals || 0) || 0;
        const winRate = bd.winRate != null
            ? bd.winRate
            : (totalProposals > 0 ? Math.round((acceptedProposals / totalProposals) * 100) : null);

        const statsHtml = [
            avgRating ? `<div class="stat">
                <div class="stat-stars">${renderStars(avgRating)}</div>
                <div class="stat-value" style="font-size:1.4rem;">${avgRating.toFixed(1)}</div>
                <div class="stat-label">Avg Rating${reviewCount ? ` (${reviewCount})` : ''}</div>
            </div>` : '',
            acceptedProposals > 0 ? `<div class="stat"><div class="stat-value">${acceptedProposals}</div><div class="stat-label">Accepted Proposals</div></div>` : '',
            winRate != null ? `<div class="stat"><div class="stat-value">${winRate}%</div><div class="stat-label">Win Rate</div></div>` : '',
            hasYears ? `<div class="stat"><div class="stat-value">${r.years_experience}</div><div class="stat-label">Yrs Experience</div></div>` : '',
            hasLicense ? `<div class="stat"><div class="stat-value" style="font-size:0.95rem;padding-top:0.4rem;">${esc(r.license_number)}</div><div class="stat-label">License #</div></div>` : '',
        ].filter(Boolean).join('');

        // Earned badges from API (objects with label/icon/color, or plain strings)
        const earnedBadgesHtml = (bd.badges && bd.badges.length)
            ? `<div class="earned-badges">${bd.badges.map(renderBadgeChip).join('')}</div>`
            : '';

        const detailsHtml = [
            r.company_name || r.brokerage ? `<div class="detail-item"><div class="detail-label">Company / Brokerage</div><div class="detail-value">${esc(r.company_name || r.brokerage)}</div></div>` : '',
            r.zip_code     ? `<div class="detail-item"><div class="detail-label">Primary Market</div><div class="detail-value">${esc(r.zip_code)}</div></div>` : '',
        ].filter(Boolean).join('');

        // Availability
        const hasAvail = av && av.length > 0;
        const availSection = `
            <div class="profile-card" id="availCard">
                <div class="section-title">Weekly Availability</div>
                ${hasAvail
                    ? `<div class="avail-grid">${renderAvailability(av)}</div>`
                    : `<p style="color:var(--muted);font-size:0.9rem;">No schedule set. Schedule a showing request via the listing page.</p>`
                }
            </div>`;

        // Rating badge for header (from reviews endpoint or profile data)
        const headerRating = avgRating && reviewCount
            ? `<span class="review-stars" style="font-size:1.1rem;">${renderStars(avgRating)}</span>
               <strong>${avgRating.toFixed(1)}</strong>
               <span style="color:#888;font-size:0.85rem;">(${reviewCount} review${reviewCount !== 1 ? 's' : ''})</span>`
            : '';

        document.getElementById('profileContent').innerHTML = `
            <div class="profile-card">
                <div class="profile-header">
                    <div class="avatar">${r.profile_photo
                        ? `<img src="${esc(r.profile_photo)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
                        : esc(initials.toUpperCase())
                    }</div>
                    <div class="profile-name-block">
                        <h1>${esc(r.first_name)} ${esc(r.last_name)}</h1>
                        ${r.company_name || r.brokerage ? `<div class="company-name">${esc(r.company_name || r.brokerage)}</div>` : ''}
                        <div class="badges" style="margin-top:0.6rem;">
                            ${r.is_founding_member ? '<span class="badge" style="background:#FFF7ED;color:#C2410C;border:1px solid #FED7AA;">🏅 Founding Member</span>' : ''}
                            ${isFeatured ? '<span class="badge badge-featured">⭐ Featured Agent</span>' : ''}
                            ${r.license_verified
                                ? '<span class="badge badge-verified" style="background:#ECFDF5;color:#059669;">✓ License Verified</span>'
                                : (hasLicense ? '<span class="badge badge-verified">✓ Licensed</span>' : '')}
                            ${serviceAreas.map(a => `<span class="badge badge-area">${esc(a)}</span>`).join('')}
                        </div>
                        ${headerRating ? `<div style="margin-top:0.5rem;display:flex;align-items:center;gap:0.4rem;">${headerRating}</div>` : ''}
                        <button id="saveRealtorBtn" onclick="toggleSaveProfile()" style="margin-top:0.75rem;background:none;border:1px solid #e5e7eb;border-radius:20px;padding:6px 16px;cursor:pointer;font-size:0.9rem;font-weight:600;color:${isRealtorSaved ? '#ef4444' : '#666'};border-color:${isRealtorSaved ? '#ef4444' : '#e5e7eb'};">${isRealtorSaved ? '♥ Saved' : '♡ Save Realtor'}</button>
                    </div>
                </div>

                ${statsHtml ? `<div class="stats-row">${statsHtml}</div>` : ''}

                ${hasBio ? `<div class="section-title">About</div><p class="bio-text">${esc(r.bio)}</p>` : ''}
                ${rt && rt.label
                    ? `<div style="display:inline-block;background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;border-radius:20px;padding:4px 12px;font-size:0.85rem;font-weight:600;margin-top:0.5rem;">⚡ ${esc(rt.label)}</div>`
                    : `<div style="display:inline-block;background:#f9fafb;border:1px solid #e5e7eb;color:#9ca3af;border-radius:20px;padding:4px 12px;font-size:0.85rem;margin-top:0.5rem;">⏱ Response time not yet available</div>`
                }
            </div>

            ${earnedBadgesHtml ? `
                <div class="profile-card">
                    <div class="section-title">Earned Badges</div>
                    ${earnedBadgesHtml}
                </div>` : ''}

            ${detailsHtml ? `
                <div class="profile-card">
                    <div class="section-title">Details</div>
                    <div class="details-grid">${detailsHtml}</div>
                </div>` : ''}

            <div class="profile-card" id="reviewsCard">
                <div class="section-title">Reviews</div>
                <div id="reviewsList">${renderReviewsHtml(rv)}</div>
                <div id="reviewFormSection" style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);">
                    <h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem;">Leave a Review</h3>
                    <div style="display:flex;gap:0.5rem;margin-bottom:1rem;" id="starRating">
                        ${[1,2,3,4,5].map(n => `<span data-star="${n}" onclick="selectStar(${n})" style="font-size:2rem;cursor:pointer;color:#d1d5db;transition:color 0.15s;">★</span>`).join('')}
                    </div>
                    <textarea id="reviewComment" rows="3" placeholder="Share your experience working with this realtor…" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;resize:vertical;margin-bottom:0.75rem;font-family:inherit;"></textarea>
                    <div id="reviewError" style="display:none;color:#ef4444;font-size:0.85rem;margin-bottom:0.75rem;"></div>
                    <button onclick="submitReview()" style="background:var(--accent);color:white;border:none;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;">Submit Review</button>
                </div>
            </div>

            ${availSection}

            ${currentUserId ? `
            <div class="profile-card" id="contactCard">
                <div class="section-title">Get in Touch</div>
                <p style="color:var(--muted);font-size:0.9rem;margin-bottom:1.25rem;">Ready to work with this agent? Send a direct message.</p>
                <div class="cta-row" style="margin-bottom:1.5rem;">
                    <a href="/inbox" class="cta-btn-primary">✉ Send Message</a>
                    <a href="/search" class="cta-btn-secondary">🏠 Browse Listings</a>
                </div>
                <div style="border-top:1px solid var(--border);padding-top:1.25rem;">
                    <p style="font-size:0.85rem;font-weight:600;color:var(--primary);margin-bottom:0.75rem;">Or send a quick message below:</p>
                    <textarea id="contactMsg" rows="4" placeholder="Hi, I'm interested in selling my home at…"
                              style="width:100%;padding:0.75rem;border:1px solid #e5e7eb;border-radius:8px;font-size:0.9rem;resize:vertical;margin-bottom:0.75rem;font-family:inherit;"></textarea>
                    <button onclick="sendContactMessage()"
                            style="background:var(--primary);color:white;border:none;padding:0.75rem 1.5rem;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.95rem;">
                        Send Message
                    </button>
                    <p id="contactStatus" style="margin-top:0.5rem;font-size:0.85rem;text-align:center;"></p>
                </div>
            </div>` : `
            <div class="profile-card" id="contactCard" style="background:linear-gradient(135deg,#0A2540 0%,#0d3659 100%);border:none;">
                <div class="section-title" style="color:rgba(255,255,255,0.55);">Work With This Agent</div>
                <h3 style="font-family:'Crimson Pro',serif;font-size:1.6rem;color:white;margin-bottom:0.75rem;">Want ${esc(r.first_name)} competing for your listing?</h3>
                <p style="color:rgba(255,255,255,0.8);font-size:0.95rem;line-height:1.6;margin-bottom:1.5rem;">List your home free on RealtorFinder. Verified agents submit proposals — you choose the best fit, no obligation.</p>
                <div class="cta-row">
                    <a href="/login?tab=signup&type=seller" style="background:#FF6B35;color:white;padding:0.75rem 1.5rem;border-radius:8px;font-weight:700;text-decoration:none;font-size:0.95rem;">🏡 List My Home Free</a>
                    <a href="/login?tab=signup&type=realtor" style="background:transparent;color:white;border:1.5px solid rgba(255,255,255,0.4);padding:0.75rem 1.5rem;border-radius:8px;font-weight:600;text-decoration:none;font-size:0.95rem;">I'm a Realtor</a>
                </div>
            </div>`}
        `;
    }

    async function loadReviews() {
        try {
            const res = await fetch(`/api/realtors/${realtorId}/reviews`);
            if (!res.ok) return;
            const { reviews, avg, count } = await res.json();

            // Update header rating badge
            if (avg && count) {
                const starsFull = Math.floor(avg);
                const hasHalf = avg % 1 >= 0.5;
                const stars = '★'.repeat(starsFull) + (hasHalf ? '½' : '') + '☆'.repeat(5 - Math.ceil(avg));
                const ratingEl = document.getElementById('profileRatingBadge');
                if (ratingEl) ratingEl.innerHTML = `<span style="color:#F59E0B;font-size:1.1rem;">${stars}</span> <strong>${parseFloat(avg).toFixed(1)}</strong> <span style="color:#888;font-size:0.85rem;">(${count} review${count!==1?'s':''})</span>`;
            }

            const container = document.getElementById('reviewsList');
            const stars = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
            const reviewsHtml = count ? `
                <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;">
                    <span style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:900;color:var(--primary);">${avg}</span>
                    <span style="color:#f59e0b;font-size:1.2rem;">${stars(parseFloat(avg))}</span>
                    <span style="color:var(--muted);font-size:0.85rem;">${count} review${count !== 1 ? 's' : ''}</span>
                </div>
                ${reviews.map(r => `
                    <div style="padding:1rem 0;border-top:1px solid var(--border);">
                        <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.4rem;flex-wrap:wrap;">
                            <span style="color:#f59e0b;">${stars(r.rating)}</span>
                            <span style="font-weight:600;font-size:0.9rem;">${esc(r.reviewer_name || ((r.first_name || '') + (r.last_name ? ' ' + r.last_name[0] + '.' : '')) || 'Anonymous')}</span>
                            <span style="color:var(--muted);font-size:0.8rem;">${new Date(r.created_at).toLocaleDateString('en-US',{month:'short',year:'numeric'})}</span>
                            ${r.verified_sale ? '<span style="background:#d1fae5;color:#065f46;font-size:0.72rem;padding:2px 8px;border-radius:20px;font-weight:700;">✓ Verified Sale</span>' : ''}
                        </div>
                        ${r.body || r.comment ? `<p style="font-size:0.9rem;color:#444;line-height:1.6;">${esc(r.body || r.comment)}</p>` : ''}
                        ${r.listing_address ? `<p style="font-size:0.78rem;color:var(--muted);margin-top:0.3rem;">📍 ${esc(r.listing_address)}</p>` : ''}
                    </div>
                `).join('')}
            ` : '<p style="color:var(--muted);font-size:0.9rem;">No reviews yet.</p>';
            // Preserve the form section if already rendered (e.g. after submit)
            const existingForm = document.getElementById('reviewFormSection');
            const formHtml = existingForm ? existingForm.outerHTML : `
                <div id="reviewFormSection" style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);">
                    <h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem;">Leave a Review</h3>
                    <div style="display:flex;gap:0.5rem;margin-bottom:1rem;" id="starRating">
                        ${[1,2,3,4,5].map(n => `<span data-star="${n}" onclick="selectStar(${n})" style="font-size:2rem;cursor:pointer;color:#d1d5db;transition:color 0.15s;">★</span>`).join('')}
                    </div>
                    <textarea id="reviewComment" rows="3" placeholder="Share your experience working with this realtor..." style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;resize:vertical;margin-bottom:0.75rem;"></textarea>
                    <div id="reviewError" style="display:none;color:#ef4444;font-size:0.85rem;margin-bottom:0.75rem;"></div>
                    <button onclick="submitReview()" style="background:var(--accent);color:white;border:none;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;">Submit Review</button>
                </div>`;
            container.innerHTML = reviewsHtml + formHtml;
        } catch {}
    }

    let selectedRating = 0;
    function selectStar(n) {
        selectedRating = n;
        document.querySelectorAll('#starRating [data-star]').forEach(el => {
            el.style.color = parseInt(el.dataset.star) <= n ? '#f59e0b' : '#d1d5db';
        });
    }

    async function submitReview() {
        const errEl = document.getElementById('reviewError');
        errEl.style.display = 'none';
        if (!selectedRating) { errEl.textContent = 'Please select a star rating.'; errEl.style.display = 'block'; return; }
        const comment = document.getElementById('reviewComment').value;
        const listingId = new URLSearchParams(window.location.search).get('listing_id') || null;
        try {
            const res = await fetch('/api/reviews', {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ realtor_id: parseInt(realtorId), listing_id: listingId ? parseInt(listingId) : null, rating: selectedRating, comment })
            });
            const d = await res.json();
            if (!res.ok) { errEl.textContent = d.error || 'Failed to submit review.'; errEl.style.display = 'block'; return; }
            document.getElementById('reviewFormSection').innerHTML = '<p style="color:#065f46;font-weight:600;">Thank you for your review!</p>';
            selectedRating = 0;
            loadReviews(); // refresh list and rating badge only — form already replaced above
        } catch { errEl.textContent = 'Network error. Please try again.'; errEl.style.display = 'block'; }
    }

    async function sendContactMessage() {
        const msg = document.getElementById('contactMsg').value.trim();
        const statusEl = document.getElementById('contactStatus');
        if (!msg) { statusEl.textContent = 'Please enter a message.'; statusEl.style.color = '#ef4444'; return; }
        try {
            const authRes = await fetch('/api/auth/me', { credentials: 'include' });
            if (!authRes.ok) {
                statusEl.innerHTML = '<a href="/login" style="color:#FF6B35;">Log in</a> to send a message.';
                statusEl.style.color = '#666';
                return;
            }
            const res = await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ to_user_id: realtorId, body: msg }),
            });
            const data = await res.json();
            if (!res.ok) {
                statusEl.textContent = data.error || 'Failed to send message.';
                statusEl.style.color = '#ef4444';
                return;
            }
            document.getElementById('contactMsg').value = '';
            statusEl.textContent = 'Message sent!';
            statusEl.style.color = '#10B981';
        } catch {
            statusEl.textContent = 'Failed to send message. Try again.';
            statusEl.style.color = '#ef4444';
        }
    }

    // Auto-scroll to review form if ?review=1
    function checkAutoReview() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('review') === '1') {
            const card = document.getElementById('reviewsCard');
            if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        }
    }

    function showNotFound() {
        document.getElementById('profileContent').innerHTML = `
            <div class="not-found">
                <h2>Profile Not Found</h2>
                <p>This realtor profile doesn't exist or is no longer active.</p>
            </div>
        `;
    }

    function esc(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadProfile().then(() => {
        setTimeout(checkAutoReview, 600);
        if (currentUserId) {
            const btn = document.getElementById('navSignupBtn');
            if (btn) btn.style.display = 'none';
            const cta = document.getElementById('pageBottomCta');
            if (cta) cta.style.display = 'none';
        }
    });
</script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>

<section id="pageBottomCta" style="background:#0A2540;color:white;padding:4rem 2rem;text-align:center;">
    <div style="max-width:640px;margin:0 auto;">
        <h2 style="font-family:'Crimson Pro',serif;font-size:2.2rem;font-weight:900;margin-bottom:0.75rem;line-height:1.15;">Sell smarter. Let agents compete.</h2>
        <p style="font-size:1.05rem;opacity:0.85;margin-bottom:2rem;line-height:1.6;">List your home free on RealtorFinder. Receive proposals from verified agents, compare them side by side, and choose the best fit — no pressure, no commission splits.</p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
            <a href="/login?tab=signup&type=seller" style="background:#FF6B35;color:white;padding:0.9rem 2rem;border-radius:10px;font-weight:700;text-decoration:none;font-size:1rem;">List My Home Free</a>
            <a href="/login?tab=signup&type=realtor" style="background:transparent;color:white;border:2px solid rgba(255,255,255,0.35);padding:0.9rem 2rem;border-radius:10px;font-weight:600;text-decoration:none;font-size:1rem;">I'm a Realtor</a>
        </div>
    </div>
</section>
</body>
</html>
