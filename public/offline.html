<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Offline — RealtorFinder</title>
    <style>
        :root { --primary: #0A2540; --accent: #FF6B35; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #F8F6F3; color: var(--primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
        .container { text-align: center; max-width: 420px; }
        .logo { font-size: 2rem; font-weight: 900; margin-bottom: 2rem; }
        .logo span { color: var(--accent); }
        .icon { font-size: 4rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.75rem; }
        p { color: #6B7280; line-height: 1.7; margin-bottom: 1.5rem; }
        .btn { background: var(--accent); color: white; padding: 14px 32px; border-radius: 8px; text-decoration: none; font-weight: 600; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Realtor<span>Finder</span></div>
        <div class="icon">📡</div>
        <h1>You're offline</h1>
        <p>Check your internet connection and try again. RealtorFinder requires a connection to load listings and connect you with realtors.</p>
        <a href="/" class="btn" onclick="window.location.reload(); return false;">Try Again</a>
    </div>
</body>
</html>
